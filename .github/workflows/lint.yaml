name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  repository:
    name: Lint repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run repository lint
        run: .github/scripts/lint.sh

  find:
    name: Find apps
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@07f46fd2e19967768b5fd3000f91f857452b767c # 2026.11.0

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-26.04
    needs: find
    if: ${{ needs.find.outputs.addons != '[]' }}
    permissions:
      contents: read
    strategy:
      matrix:
        path: ${{ fromJSON(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-app-linter@479f4f053b96ed00a83ce2c7d8f858e22475aa98 # v2.21.3
        with:
          path: "./${{ matrix.path }}"

  result:
    name: Lint result
    runs-on: ubuntu-26.04
    needs: [repository, find, lint]
    if: always()
    steps:
      - name: Fail if any lint job failed
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
